data:
  data_dir: ./data/C4-50B/
model:
  vocab_size: 32000
  hidden_size: 1280
  num_layers: 24
  num_heads: 16
  num_kv_heads: 16
  mlp_ratio: 3
  max_position_embeddings: 2048
  tie_word_embeddings: true
  parameterization: grouped_matrix
  enabled_roles:
    - attn.q
    - attn.k
    - attn.v
    - attn.o
    - mlp.gate
    - mlp.up
    - mlp.down
train:
  output: ./output/ablations/so_all_roles
  log_interval: 10
  save_freq: 7000
  batch_size: 8
  global_batch_size: 512
  seq_length: 2048
  num_steps: 21000
  lr: 0.0012
  min_lr: 0.00012
  weight_decay: 0.1
  clip_grad: 1.0
optim:
  dense_optimizer: adamw
  default_role_optimizer: so
  submat_dim: 20
  so_lr: 1.0
checkpoint:
  enabled: true
