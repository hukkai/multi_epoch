data:
  data_dir: ./data/C4-50B/
model:
  vocab_size: 32000
  hidden_size: 1024
  num_layers: 24
  num_heads: 16
  num_kv_heads: 16
  mlp_ratio: 3
  max_position_embeddings: 2048
  tie_word_embeddings: true
  parameterization: dense
  enabled_roles: []
train:
  output: ./output/360m_2048l/dense_adamw
  log_interval: 10
  save_freq: 999999
  batch_size: 8
  global_batch_size: 512
  seq_length: 2048
  num_steps: 13732
  lr: 0.0012
  min_lr: 0.00012
  weight_decay: 0.1
  clip_grad: 1.0
optim:
  default_role_optimizer: frozen
checkpoint:
  enabled: true
