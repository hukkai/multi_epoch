data:
  data_dir: ./data/C4-50B/
  val_data_dir: ./data/C4-val-1M/
model:
  vocab_size: 32000
  hidden_size: 1024
  num_layers: 24
  num_heads: 16
  num_kv_heads: 16
  mlp_ratio: 3
  max_position_embeddings: 4096
  tie_word_embeddings: true
  parameterization: grouped_matrix
  enabled_roles:
  - attn.q
  - attn.k
  - attn.v
  - attn.o
  - mlp.gate
  - mlp.up
  - mlp.down
train:
  output: ./output/360m_4096l/orth_adam
  log_interval: 10
  save_freq: 999999
  batch_size: 4
  global_batch_size: 256
  seq_length: 4096
  num_steps: 13732
  lr: 0.0012
  min_lr: 0.00012
  weight_decay: 0.1
  clip_grad: 1.0
  cosine_power: 2
  eval_interval: 274
  eval_batches: 999999 # evaluate on the entire validation set
optim:
  default_role_optimizer: orth_adam
  submat_dim: 32
  orth_adam_lr: 1.0
checkpoint:
  enabled: true
